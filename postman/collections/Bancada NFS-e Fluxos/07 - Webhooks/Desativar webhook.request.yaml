$kind: http-request
method: PATCH
url: '{{baseUrl}}/webhooks/endpoints/{{webhookId}}'
order: 5000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "active": false
    }
scripts:
- type: beforeRequest
  language: text/javascript
  code: |-
    pm.variables.set('expect', '{"status": 200, "schema": "WebhookEndpoint"}');
- type: afterResponse
  language: text/javascript
  code: |-
    pm.test('endpoint inativo', () => pm.expect(pm.response.json().active).to.be.false);
