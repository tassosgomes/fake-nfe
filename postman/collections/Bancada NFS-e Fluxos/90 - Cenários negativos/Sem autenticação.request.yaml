$kind: http-request
method: POST
url: '{{baseUrl}}/emitir'
order: 1000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "tomador": {
        "nome": "Cliente Exemplo LTDA",
        "cnpj": "19131243000197",
        "email": "financeiro@cliente.test"
      },
      "servico": {
        "descricao": "Aula de integração fiscal",
        "codigo": "010700"
      },
      "valores": {
        "total": 1500,
        "aliquotaIss": 2
      },
      "competencia": "2026-03",
      "referencia": "POC-{{runId}}",
      "simulacao": {
        "resultado": "sucesso",
        "atrasoMs": 0
      }
    }
auth:
  type: noauth
scripts:
- type: beforeRequest
  language: text/javascript
  code: |-
    pm.variables.set('expect', '{"status": 401, "code": "nao_autorizado"}');
