$kind: http-request
method: POST
url: '{{baseUrl}}/cancelar'
order: 15000
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "invoiceId": "{{rejectedInvoiceId}}"
    }
scripts:
- type: beforeRequest
  language: text/javascript
  code: |-
    pm.variables.set('expect', '{"status": 422, "code": "status_invalido"}');
