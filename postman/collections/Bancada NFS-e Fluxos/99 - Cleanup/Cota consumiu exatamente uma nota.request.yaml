$kind: http-request
method: GET
url: '{{baseUrl}}/org/settings'
order: 3000
scripts:
- type: beforeRequest
  language: text/javascript
  code: |-
    pm.variables.set('expect', '{"status": 200, "schema": "Configuracoes"}');
- type: afterResponse
  language: text/javascript
  code: |-
    pm.test('só a nota emitida conta; replay e rejeição não consomem', () => {
      pm.expect(pm.response.json().creditsUsed).to.eql(Number(pm.collectionVariables.get('creditsBefore')) + 1);
    });
