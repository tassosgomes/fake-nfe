$kind: http-request
description: Lista os endpoints de webhook do projeto da chave, ativos e inativos. O segredo nunca volta.
url: "{{baseUrl}}/webhooks/endpoints"
method: GET
headers:
  - key: X-Correlation-Id
    value: aula-123
    disabled: false
    description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
  - key: Accept
    value: application/json
auth:
  type: apikey
  credentials:
    key: x-api-key
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Listar endpoints de webhook do projeto.resources/examples
order: 1000
