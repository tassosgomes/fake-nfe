$kind: http-example
name: Teto de requisições por minuto da chave atingido (`rate_limit`).
request:
  url: "{{baseUrl}}/webhooks/endpoints/:id"
  method: DELETE
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: id
      value: wh_
      disabled: false
      description: (Required) Identificador do endpoint (`wh_…`).
  body:
    type: text
    content: ""
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: Retry-After
      value: "60"
      disabled: false
      description: Segundos até a janela do rate limit abrir de novo.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:bancada-nfse:problema:nao_encontrado",
        "title": "string",
        "status": 508,
        "detail": "string",
        "instance": "string",
        "code": "nao_encontrado",
        "campo": "string",
        "correlationId": "string",
        "aviso": "string"
      }
order: 5000
