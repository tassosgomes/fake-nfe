$kind: http-example
name: Endpoint atualizado.
request:
  url: "{{baseUrl}}/webhooks/endpoints/:id"
  method: PATCH
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: wh_
      disabled: false
      description: (Required) Identificador do endpoint (`wh_…`).
  body:
    type: json
    content: |-
      {
        "active": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: X-Ambiente
      value: string
      disabled: false
      description: Sempre `estudo`.
    - key: X-Aviso
      value: string
      disabled: false
      description: Sempre `sem-valor-fiscal`.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": "wh_",
        "projectId": "prj_",
        "url": "http://lhkLGVDtj.fcrNs1CdpqDuANQpEaMahQ8tChz6YklNOqbonPhKeVTuJi8ay6W",
        "events": [
          "nfse.cancelled",
          "nfse.cancelled"
        ],
        "hasSecret": false,
        "active": true,
        "createdAt": "1982-07-07T04:43:00.593Z"
      }
order: 1000
