$kind: http-example
name: Teto de requisições por minuto da chave atingido (`rate_limit`).
request:
  url: "{{baseUrl}}/webhooks/endpoints"
  method: POST
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "url": "http://127.0.0.1:4000/hook",
        "events": [
          "nfse.issued",
          "nfse.error",
          "nfse.cancelled",
          "nfse.documents_ready"
        ],
        "secret": "segredo-de-estudo"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: Retry-After
      value: "60"
      disabled: false
      description: Segundos até a janela do rate limit abrir de novo.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:bancada-nfse:problema:nao_encontrado",
        "title": "string",
        "status": 508,
        "detail": "string",
        "instance": "string",
        "code": "nao_encontrado",
        "campo": "string",
        "correlationId": "string",
        "aviso": "string"
      }
order: 5000
