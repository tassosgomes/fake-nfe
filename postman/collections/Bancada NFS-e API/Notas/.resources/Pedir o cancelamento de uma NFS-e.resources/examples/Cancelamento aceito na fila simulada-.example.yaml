$kind: http-example
name: Cancelamento aceito na fila simulada.
request:
  url: "{{baseUrl}}/cancelar"
  method: POST
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Idempotency-Key
      value: emissao-os-1
      disabled: false
      description: |
        Mesma chave e mesmo corpo devolvem a primeira resposta. Mesma chave com outro corpo devolve `409 idempotency_conflito`.
    - key: X-Simulacao
      value: sucesso:0
      disabled: false
      description: |
        Força o cenário da fila, como `resultado:atrasoMs` (ex. `timeout:1500`) ou JSON. O campo `simulacao` do corpo vence este header.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "invoiceId": "inv_2f6c1b0e9a4d4c7f8e3a1b2c3d4e5f60",
        "motivo": "Serviço prestado em duplicidade na mesma competência",
        "simulacao": {
          "resultado": "sucesso",
          "atrasoMs": 0
        }
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: X-Ambiente
      value: string
      disabled: false
      description: Sempre `estudo`.
    - key: X-Aviso
      value: string
      disabled: false
      description: Sempre `sem-valor-fiscal`.
    - key: Idempotent-Replayed
      value: string
      disabled: false
      description: "`true` quando a resposta é o replay de uma requisição idempotente."
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "queued": true,
        "invoiceId": "inv_",
        "status": "string",
        "aviso": "string",
        "cenario": "sucesso",
        "atrasoMs": 1008
      }
order: 1000
