$kind: http-example
name: Corpo, JSON, header ou parâmetro inválido (`payload_invalido`, `json_invalido`, `simulacao_invalida`, `idempotency_invalida`…).
request:
  url: "{{baseUrl}}/cancelar"
  method: POST
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Idempotency-Key
      value: emissao-os-1
      disabled: false
      description: |
        Mesma chave e mesmo corpo devolvem a primeira resposta. Mesma chave com outro corpo devolve `409 idempotency_conflito`.
    - key: X-Simulacao
      value: sucesso:0
      disabled: false
      description: |
        Força o cenário da fila, como `resultado:atrasoMs` (ex. `timeout:1500`) ou JSON. O campo `simulacao` do corpo vence este header.
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "invoiceId": "inv_2f6c1b0e9a4d4c7f8e3a1b2c3d4e5f60",
        "motivo": "Serviço prestado em duplicidade na mesma competência",
        "simulacao": {
          "resultado": "sucesso",
          "atrasoMs": 0
        }
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:bancada-nfse:problema:payload_invalido",
        "title": "Requisição inválida",
        "status": 400,
        "detail": "Informe CNPJ, CPF ou NIF do tomador",
        "instance": "/api/v1/emitir",
        "code": "payload_invalido",
        "campo": "tomador.cnpj",
        "correlationId": "aula-123",
        "aviso": "Ambiente de estudo. Nenhum documento foi transmitido à SEFAZ ou a uma prefeitura. Sem valor fiscal."
      }
order: 2000
