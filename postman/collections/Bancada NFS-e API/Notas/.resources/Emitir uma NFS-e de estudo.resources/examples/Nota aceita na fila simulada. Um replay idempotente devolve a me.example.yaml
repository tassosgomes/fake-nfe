$kind: http-example
name: Nota aceita na fila simulada. Um replay idempotente devolve a mesma resposta com `Idempotent-Replayed`.
request:
  url: "{{baseUrl}}/emitir"
  method: POST
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Idempotency-Key
      value: emissao-os-1
      disabled: false
      description: |
        Mesma chave e mesmo corpo devolvem a primeira resposta. Mesma chave com outro corpo devolve `409 idempotency_conflito`.
    - key: X-Simulacao
      value: sucesso:0
      disabled: false
      description: |
        Força o cenário da fila, como `resultado:atrasoMs` (ex. `timeout:1500`) ou JSON. O campo `simulacao` do corpo vence este header.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "tomador": {
          "nome": "Cliente Exemplo LTDA",
          "cnpj": "19131243000197",
          "email": "financeiro@cliente.test"
        },
        "servico": {
          "descricao": "Aula de integração fiscal",
          "codigo": "010700"
        },
        "valores": {
          "total": 1500,
          "aliquotaIss": 2
        },
        "competencia": "2026-03",
        "referencia": "OS-1",
        "simulacao": {
          "resultado": "sucesso",
          "atrasoMs": 0
        }
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: X-Ambiente
      value: string
      disabled: false
      description: Sempre `estudo`.
    - key: X-Aviso
      value: string
      disabled: false
      description: Sempre `sem-valor-fiscal`.
    - key: Idempotent-Replayed
      value: string
      disabled: false
      description: "`true` quando a resposta é o replay de uma requisição idempotente."
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "queued": false,
        "invoiceId": "inv_",
        "status": "string",
        "pollUrl": "/api/v1/invoices/inv_2f6c1b0e9a4d4c7f8e3a1b2c3d4e5f60/status",
        "aviso": "string",
        "cenario": "timeout",
        "origemCenario": "forcado",
        "atrasoMs": 4739
      }
order: 1000
