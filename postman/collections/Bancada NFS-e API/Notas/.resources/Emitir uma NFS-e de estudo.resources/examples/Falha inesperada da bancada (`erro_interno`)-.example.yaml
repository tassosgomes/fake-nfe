$kind: http-example
name: Falha inesperada da bancada (`erro_interno`).
request:
  url: "{{baseUrl}}/emitir"
  method: POST
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Idempotency-Key
      value: emissao-os-1
      disabled: false
      description: |
        Mesma chave e mesmo corpo devolvem a primeira resposta. Mesma chave com outro corpo devolve `409 idempotency_conflito`.
    - key: X-Simulacao
      value: sucesso:0
      disabled: false
      description: |
        Força o cenário da fila, como `resultado:atrasoMs` (ex. `timeout:1500`) ou JSON. O campo `simulacao` do corpo vence este header.
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "tomador": {
          "nome": "Cliente Exemplo LTDA",
          "cnpj": "19131243000197",
          "email": "financeiro@cliente.test"
        },
        "servico": {
          "descricao": "Aula de integração fiscal",
          "codigo": "010700"
        },
        "valores": {
          "total": 1500,
          "aliquotaIss": 2
        },
        "competencia": "2026-03",
        "referencia": "OS-1",
        "simulacao": {
          "resultado": "sucesso",
          "atrasoMs": 0
        }
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:bancada-nfse:problema:nao_encontrado",
        "title": "string",
        "status": 422,
        "detail": "string",
        "instance": "string",
        "code": "nao_encontrado",
        "campo": "string",
        "correlationId": "string",
        "aviso": "string"
      }
order: 8000
