$kind: http-example
name: XML de estudo, como anexo.
request:
  url: "{{baseUrl}}/invoices/:id/xml?type=emission"
  method: GET
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/xml
  queryParams:
    type: emission
  pathVariables:
    - key: id
      value: inv_2f6c1b0e9a4d4c7f8e3a1b2c3d4e5f60
      disabled: false
      description: (Required) Identificador da nota (`inv_…`), devolvido pela emissão.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: X-Ambiente
      value: string
      disabled: false
      description: Sempre `estudo`.
    - key: X-Aviso
      value: string
      disabled: false
      description: Sempre `sem-valor-fiscal`.
    - key: Content-Disposition
      value: attachment; filename="nfse-estudo-000001.xml"
      disabled: false
      description: Nome do arquivo de estudo.
    - key: Content-Type
      value: application/xml
  body:
    type: xml
    content: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <element><NfseEstudo><Aviso>Sem valor fiscal</Aviso></NfseEstudo></element>
order: 1000
