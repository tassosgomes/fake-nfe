$kind: http-example
name: O documento ainda não existe para o estado atual da nota (`documento_indisponivel`).
request:
  url: "{{baseUrl}}/invoices/:id/xml?type=emission"
  method: GET
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/problem+json
  queryParams:
    type: emission
  pathVariables:
    - key: id
      value: inv_2f6c1b0e9a4d4c7f8e3a1b2c3d4e5f60
      disabled: false
      description: (Required) Identificador da nota (`inv_…`), devolvido pela emissão.
  body:
    type: text
    content: ""
response:
  statusCode: 409
  statusText: Conflict
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:bancada-nfse:problema:nao_encontrado",
        "title": "string",
        "status": 508,
        "detail": "string",
        "instance": "string",
        "code": "nao_encontrado",
        "campo": "string",
        "correlationId": "string",
        "aviso": "string"
      }
order: 5000
