$kind: http-example
name: Estado atual da nota.
request:
  url: "{{baseUrl}}/invoices/:id/status"
  method: GET
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: inv_2f6c1b0e9a4d4c7f8e3a1b2c3d4e5f60
      disabled: false
      description: (Required) Identificador da nota (`inv_…`), devolvido pela emissão.
