$kind: http-request
description: Disponível com a nota `issued` ou `cancelled`. O PDF traz a faixa "sem valor fiscal".
url: "{{baseUrl}}/invoices/:id/pdf"
method: GET
headers:
  - key: X-Correlation-Id
    value: aula-123
    disabled: false
    description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
  - key: Accept
    value: application/pdf
pathVariables:
  - key: id
    value: inv_2f6c1b0e9a4d4c7f8e3a1b2c3d4e5f60
    disabled: false
    description: (Required) Identificador da nota (`inv_…`), devolvido pela emissão.
auth:
  type: apikey
  credentials:
    key: x-api-key
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Baixar o PDF de estudo.resources/examples
order: 4000
