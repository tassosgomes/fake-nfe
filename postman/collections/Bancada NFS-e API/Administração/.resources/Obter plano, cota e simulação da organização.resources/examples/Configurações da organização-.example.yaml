$kind: http-example
name: Configurações da organização.
request:
  url: "{{baseUrl}}/org/settings"
  method: GET
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: X-Ambiente
      value: string
      disabled: false
      description: Sempre `estudo`.
    - key: X-Aviso
      value: string
      disabled: false
      description: Sempre `sem-valor-fiscal`.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "slug": "string",
        "planName": "string",
        "creditsUsed": 7348,
        "creditsLimit": 3190,
        "projectLimit": 3385,
        "latencyMinMs": 5054,
        "latencyMaxMs": 6233,
        "failureRate": 32,
        "retries": [
          5601,
          4543
        ],
        "storageBaseUrl": "string",
        "storageStatus": "verified"
      }
order: 1000
