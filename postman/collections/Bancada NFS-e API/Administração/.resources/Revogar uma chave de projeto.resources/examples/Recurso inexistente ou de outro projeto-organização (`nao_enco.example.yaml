$kind: http-example
name: Recurso inexistente ou de outro projeto/organização (`nao_encontrado`).
request:
  url: "{{baseUrl}}/org/projects/:id/api-keys/:keyId"
  method: DELETE
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: id
      value: prj_9a8b7c6d5e4f40312a1b2c3d4e5f6071
      disabled: false
      description: (Required) Identificador da empresa (`prj_…`).
    - key: keyId
      value: key_
      disabled: false
      description: (Required) Identificador da chave (`key_…`).
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:bancada-nfse:problema:nao_encontrado",
        "title": "string",
        "status": 508,
        "detail": "string",
        "instance": "string",
        "code": "nao_encontrado",
        "campo": "string",
        "correlationId": "string",
        "aviso": "string"
      }
order: 4000
