$kind: http-example
name: Último e próximo número.
request:
  url: "{{baseUrl}}/org/projects/:id/numeracao"
  method: GET
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: prj_9a8b7c6d5e4f40312a1b2c3d4e5f6071
      disabled: false
      description: (Required) Identificador da empresa (`prj_…`).
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: X-Ambiente
      value: string
      disabled: false
      description: Sempre `estudo`.
    - key: X-Aviso
      value: string
      disabled: false
      description: Sempre `sem-valor-fiscal`.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "nfse": {
          "ultimoNumero": 9874,
          "proximoNumero": 3775,
          "serie": "string"
        }
      }
order: 1000
