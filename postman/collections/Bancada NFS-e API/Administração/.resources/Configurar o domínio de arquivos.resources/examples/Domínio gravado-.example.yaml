$kind: http-example
name: Domínio gravado.
request:
  url: "{{baseUrl}}/org/settings"
  method: PATCH
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "storageBaseUrl": "https://arquivos.estudo.test",
        "simularVerificacao": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: X-Ambiente
      value: string
      disabled: false
      description: Sempre `estudo`.
    - key: X-Aviso
      value: string
      disabled: false
      description: Sempre `sem-valor-fiscal`.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "storageBaseUrl": "string",
        "status": "verified",
        "message": "string"
      }
order: 1000
