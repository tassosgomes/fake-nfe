$kind: http-example
name: Falha inesperada da bancada (`erro_interno`).
request:
  url: "{{baseUrl}}/org/settings"
  method: PATCH
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "storageBaseUrl": "https://arquivos.estudo.test",
        "simularVerificacao": false
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:bancada-nfse:problema:nao_encontrado",
        "title": "string",
        "status": 508,
        "detail": "string",
        "instance": "string",
        "code": "nao_encontrado",
        "campo": "string",
        "correlationId": "string",
        "aviso": "string"
      }
order: 7000
