$kind: http-example
name: Token sem permissão ou limite de empresas do plano atingido (`limite_de_empresas`).
request:
  url: "{{baseUrl}}/org/projects"
  method: POST
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "name": "Filial Centro",
        "cnpj": "11222333000181",
        "razaoSocial": "Filial de Estudo LTDA",
        "codigoMunicipio": "3550308",
        "serieNfse": "1"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:bancada-nfse:problema:nao_encontrado",
        "title": "string",
        "status": 508,
        "detail": "string",
        "instance": "string",
        "code": "nao_encontrado",
        "campo": "string",
        "correlationId": "string",
        "aviso": "string"
      }
order: 4000
