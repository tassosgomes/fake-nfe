$kind: http-example
name: Empresa criada.
request:
  url: "{{baseUrl}}/org/projects"
  method: POST
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Filial Centro",
        "cnpj": "11222333000181",
        "razaoSocial": "Filial de Estudo LTDA",
        "codigoMunicipio": "3550308",
        "serieNfse": "1"
      }
