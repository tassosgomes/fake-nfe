$kind: http-example
name: Metadado do certificado registrado.
request:
  url: "{{baseUrl}}/org/projects/:id/certificate"
  method: POST
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: prj_9a8b7c6d5e4f40312a1b2c3d4e5f6071
      disabled: false
      description: (Required) Identificador da empresa (`prj_…`).
  body:
    type: formdata
    content:
      - type: text
        key: file
        value: string
        description: (Required) Arquivo `.pfx` de até 50 KB.
      - type: text
        key: password
        value: string
        description: (Required) Senha do certificado. É descartada.
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: X-Ambiente
      value: string
      disabled: false
      description: Sempre `estudo`.
    - key: X-Aviso
      value: string
      disabled: false
      description: Sempre `sem-valor-fiscal`.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "fileName": "string",
        "validado": false,
        "aviso": "string",
        "uploadedAt": "2018-01-23T09:51:14.228Z"
      }
order: 1000
