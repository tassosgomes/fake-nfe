$kind: http-example
name: Header `x-api-key` ausente ou chave desconhecida (`nao_autorizado`).
request:
  url: "{{baseUrl}}/org/projects/:id/numeracao"
  method: PATCH
  headers:
    - key: x-api-key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: X-Correlation-Id
      value: aula-123
      disabled: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: id
      value: prj_9a8b7c6d5e4f40312a1b2c3d4e5f6071
      disabled: false
      description: (Required) Identificador da empresa (`prj_…`).
  body:
    type: json
    content: |-
      {
        "ultimoNumeroNfse": 120
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Correlation ID recebido ou gerado pela bancada.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:bancada-nfse:problema:nao_autorizado",
        "title": "Não autenticado",
        "status": 401,
        "detail": "Informe o header x-api-key.",
        "instance": "/api/v1/emitir",
        "code": "nao_autorizado",
        "campo": null,
        "correlationId": "aula-123",
        "aviso": "Ambiente de estudo. Nenhum documento foi transmitido à SEFAZ ou a uma prefeitura. Sem valor fiscal."
      }
order: 3000
