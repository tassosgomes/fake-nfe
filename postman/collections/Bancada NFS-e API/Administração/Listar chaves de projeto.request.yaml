$kind: http-request
description: Mostra só o prefixo das chaves.
url: "{{baseUrl}}/org/projects/:id/api-keys"
method: GET
headers:
  - key: X-Correlation-Id
    value: aula-123
    disabled: false
    description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: prj_9a8b7c6d5e4f40312a1b2c3d4e5f6071
    disabled: false
    description: (Required) Identificador da empresa (`prj_…`).
auth:
  type: apikey
  credentials:
    key: x-api-key
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Listar chaves de projeto.resources/examples
order: 8000
