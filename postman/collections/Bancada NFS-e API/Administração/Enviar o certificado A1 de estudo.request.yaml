$kind: http-request
description: |
  Exige arquivo e senha, como um gateway real, mas a bancada **descarta a senha, não abre o arquivo e não assina nada**.
  Só o nome do arquivo é guardado.
url: "{{baseUrl}}/org/projects/:id/certificate"
method: POST
headers:
  - key: X-Correlation-Id
    value: aula-123
    disabled: false
    description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
  - key: Content-Type
    value: multipart/form-data
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: prj_9a8b7c6d5e4f40312a1b2c3d4e5f6071
    disabled: false
    description: (Required) Identificador da empresa (`prj_…`).
body:
  type: formdata
  content:
    - type: text
      key: file
      value: string
      description: (Required) Arquivo `.pfx` de até 50 KB.
    - type: text
      key: password
      value: string
      description: (Required) Senha do certificado. É descartada.
auth:
  type: apikey
  credentials:
    key: x-api-key
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Enviar o certificado A1 de estudo.resources/examples
order: 11000
