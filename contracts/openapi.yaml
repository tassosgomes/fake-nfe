openapi: 3.1.0
info:
  title: Bancada NFS-e API
  version: 1.0.0
  summary: API de estudo do ciclo de vida de uma NFS-e simulada.
  description: |
    Laboratório para estudar emissão, consulta, documentos, cancelamento e webhooks de uma NFS-e.

    **Nada aqui tem valor fiscal.** A bancada não fala com SEFAZ, prefeitura nem provedor fiscal.
    Toda resposta leva `X-Ambiente: estudo` e `X-Aviso: sem-valor-fiscal`.

    ## Autenticação
    O header `x-api-key` aceita dois tipos de credencial:

    - **Chave de projeto** (`ntaas_…`): emissão, consulta, documentos, cancelamento e webhooks.
    - **Token de organização** (`ntaas_org_…`): empresas, numeração, chaves, certificado, logo e configurações.

    ## Erros
    Toda falha responde `application/problem+json` (RFC 9457). O membro `code` é estável e serve para
    decidir o que fazer; `campo` aponta o campo do corpo em erros de validação.

    ## Correlation ID
    Envie `X-Correlation-Id` para rastrear a chamada. Sem ele, ou com valor fora do padrão, a bancada gera um UUID.
    O valor volta no header de toda resposta e no corpo dos erros.

    ## Fila simulada
    Emissão e cancelamento respondem `202` e seguem numa fila com atraso e chance de falha configuráveis.
    Para um resultado previsível, force o cenário com `simulacao` no corpo ou com o header `X-Simulacao`.
  contact:
    name: Tasso Gomes
    url: https://github.com/tassosgomes/fake-nfe
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Bancada local (`npm run dev` ou `npm start`)
tags:
  - name: Saúde
    description: Verificação de disponibilidade, sem autenticação.
  - name: Notas
    description: Ciclo de vida da NFS-e de estudo. Superfície pública para integradores (chave de projeto).
  - name: Webhooks
    description: Cadastro de endpoints e histórico de entregas. Superfície pública para integradores (chave de projeto).
  - name: Administração
    description: Gestão da organização, empresas e chaves. Superfície interna (token de organização).
security:
  - chaveProjeto: []

paths:
  /health:
    get:
      operationId: verificarSaude
      tags: [Saúde]
      summary: Verificar a saúde da bancada
      description: Responde `200` quando o banco de estudo responde. Não pede chave e não conta no rate limit.
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Bancada disponível.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saude'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'

  /emitir:
    post:
      operationId: emitirNfse
      tags: [Notas]
      summary: Emitir uma NFS-e de estudo
      security:
        - chaveProjeto: []
      description: |
        Coloca a nota na fila simulada e responde `202` com `invoiceId`. A nota nasce `queued` e **não está autorizada**
        nesta resposta: consulte `GET /invoices/{id}/status` até `issued` ou `error`.

        O tomador precisa de CNPJ, CPF ou NIF. CNPJ e CPF passam pela validação dos dígitos.
        Campos adicionais em `tomador`, `servico` e `valores` (exportação, obra, IBS/CBS…) são guardados e reaparecem no XML.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Simulacao'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmissaoRequest'
            examples:
              sucessoImediato:
                summary: Emissão com sucesso forçado e sem atraso
                value:
                  tomador:
                    nome: Cliente Exemplo LTDA
                    cnpj: '19131243000197'
                    email: financeiro@cliente.test
                  servico:
                    descricao: Aula de integração fiscal
                    codigo: '010700'
                  valores:
                    total: 1500
                    aliquotaIss: 2
                  competencia: 2026-03
                  referencia: OS-1
                  simulacao:
                    resultado: sucesso
                    atrasoMs: 0
              rejeicao:
                summary: Rejeição municipal forçada
                value:
                  tomador:
                    nome: Cliente Exemplo LTDA
                    cnpj: '19131243000197'
                  servico:
                    descricao: Aula de integração fiscal
                  valores:
                    total: 1500
                    aliquotaIss: 2
                  simulacao:
                    resultado: rejeicao
                    atrasoMs: 0
      responses:
        '202':
          description: Nota aceita na fila simulada. Um replay idempotente devolve a mesma resposta com `Idempotent-Replayed`.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissaoAceita'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Chave sem permissão ou cota do plano de estudo esgotada (`cota_esgotada`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: urn:bancada-nfse:problema:cota_esgotada
                title: Acesso negado
                status: 403
                detail: A cota de notas do plano de estudo acabou.
                instance: /api/v1/emitir
                code: cota_esgotada
                campo: null
                correlationId: 3f2a9d4e-6b1c-4f0e-9a52-7c1d2e3f4a5b
                aviso: Ambiente de estudo. Nenhum documento foi transmitido à SEFAZ ou a uma prefeitura. Sem valor fiscal.
        '409':
          $ref: '#/components/responses/ConflitoIdempotencia'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /invoices/{id}/status:
    get:
      operationId: consultarNfse
      tags: [Notas]
      summary: Consultar o estado de uma NFS-e
      security:
        - chaveProjeto: []
      description: Estados possíveis — `queued`, `processing`, `issued`, `error`, `cancel_queued`, `cancelled`.
      x-governanca-excecoes:
        tsg-collection-pagination-params: 'Não é coleção: `status` é um recurso único da nota.'
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado atual da nota.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nota'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /invoices/{id}/xml:
    get:
      operationId: baixarXmlNfse
      tags: [Notas]
      summary: Baixar o XML de estudo
      security:
        - chaveProjeto: []
      x-governanca-excecoes:
        tsg-content-type-json-only: 'O documento fiscal de estudo é XML por natureza; erros continuam em problem+json.'
      description: |
        Disponível com a nota `issued` ou `cancelled`. Com `type=cancel`, devolve o XML do cancelamento, que só existe
        para nota `cancelled`. A raiz é `NfseEstudo`, sem o leiaute oficial.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: type
          in: query
          required: false
          description: Qual XML baixar. Qualquer valor diferente de `cancel` devolve o XML da emissão.
          schema:
            type: string
            enum: [emission, cancel]
            default: emission
      responses:
        '200':
          description: XML de estudo, como anexo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
            Content-Disposition:
              $ref: '#/components/headers/Content-Disposition'
          content:
            application/xml:
              schema:
                type: string
              example: <NfseEstudo><Aviso>Sem valor fiscal</Aviso></NfseEstudo>
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/DocumentoIndisponivel'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /invoices/{id}/pdf:
    get:
      operationId: baixarPdfNfse
      tags: [Notas]
      summary: Baixar o PDF de estudo
      security:
        - chaveProjeto: []
      x-governanca-excecoes:
        tsg-content-type-json-only: 'O DANFSe de estudo é PDF binário; erros continuam em problem+json.'
      description: Disponível com a nota `issued` ou `cancelled`. O PDF traz a faixa "sem valor fiscal".
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: PDF de estudo, exibido inline.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
            Content-Disposition:
              $ref: '#/components/headers/Content-Disposition'
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/DocumentoIndisponivel'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /cancelar:
    post:
      operationId: cancelarNfse
      tags: [Notas]
      summary: Pedir o cancelamento de uma NFS-e
      security:
        - chaveProjeto: []
      description: |
        Só uma nota `issued` entra na fila de cancelamento. Se a prefeitura simulada recusa, a nota volta para `issued`
        e o status mostra `cancelamentoRecusado`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Simulacao'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelamentoRequest'
            example:
              invoiceId: inv_2f6c1b0e9a4d4c7f8e3a1b2c3d4e5f60
              motivo: Serviço prestado em duplicidade na mesma competência
              simulacao:
                resultado: sucesso
                atrasoMs: 0
      responses:
        '202':
          description: Cancelamento aceito na fila simulada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelamentoAceito'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ConflitoIdempotencia'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /webhooks/endpoints:
    get:
      operationId: listarWebhooks
      tags: [Webhooks]
      summary: Listar endpoints de webhook do projeto
      description: Lista os endpoints de webhook do projeto da chave, ativos e inativos. O segredo nunca volta.
      security:
        - chaveProjeto: []
      x-governanca-excecoes:
        tsg-collection-pagination-params: 'Coleção pequena e limitada por projeto; não há paginação.'
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Endpoints cadastrados, do mais recente para o mais antigo.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaWebhooks'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      operationId: criarWebhook
      tags: [Webhooks]
      summary: Cadastrar um endpoint de webhook
      security:
        - chaveProjeto: []
      description: |
        `http://localhost` e `http://127.0.0.1` são aceitos de propósito, para o estudo rodar na mesma máquina.
        O segredo é devolvido só nesta resposta.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointRequest'
            example:
              url: http://127.0.0.1:4000/hook
              events: [nfse.issued, nfse.error, nfse.cancelled, nfse.documents_ready]
              secret: segredo-de-estudo
      responses:
        '201':
          description: Endpoint criado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCriado'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /webhooks/endpoints/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do endpoint (`wh_…`).
        schema:
          type: string
          pattern: ^wh_
    patch:
      operationId: atualizarWebhook
      tags: [Webhooks]
      summary: Atualizar um endpoint de webhook
      security:
        - chaveProjeto: []
      description: Atualiza só os campos enviados. `secret` com `null` ou `""` remove o segredo.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointPatch'
            example:
              active: false
      responses:
        '200':
          description: Endpoint atualizado.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      operationId: removerWebhook
      tags: [Webhooks]
      summary: Remover um endpoint de webhook
      description: Remove o endpoint. Entregas já registradas continuam no histórico.
      security:
        - chaveProjeto: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Endpoint removido.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRemovido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /webhooks/endpoints/{id}/test:
    post:
      operationId: testarWebhook
      tags: [Webhooks]
      summary: Enfileirar um evento de teste
      security:
        - chaveProjeto: []
      description: 'Enfileira um `nfse.issued` marcado com `"teste": true`. O endpoint precisa assinar `nfse.issued`.'
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do endpoint (`wh_…`).
          schema:
            type: string
            pattern: ^wh_
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: Entrega de teste enfileirada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntregaTesteEnfileirada'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /webhooks/deliveries:
    get:
      operationId: listarEntregasWebhook
      tags: [Webhooks]
      summary: Listar o histórico de entregas
      security:
        - chaveProjeto: []
      description: Inclui entregas pendentes, bem-sucedidas e falhas, da mais recente para a mais antiga.
      x-governanca-excecoes:
        tsg-collection-pagination-params: 'Histórico recente com teto de 100 itens via `limit`; não há navegação por páginas.'
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: limit
          in: query
          required: false
          description: Quantidade máxima de entregas.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Histórico de entregas.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaEntregasWebhook'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /org/projects:
    get:
      operationId: listarEmpresas
      tags: [Administração]
      summary: Listar empresas da organização
      description: Lista as empresas da organização, paginadas. Sem `active`, só as ativas.
      security:
        - tokenOrganizacao: []
      x-governanca-excecoes:
        tsg-collection-pagination-params: 'A API já pagina com `page` e `limit`; renomear para `_page`/`_size` quebra integradores. Rever na próxima versão major.'
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: active
          in: query
          required: false
          description: '`false` ou `all` incluem empresas desativadas. Sem o parâmetro, só as ativas.'
          schema:
            type: string
            enum: ['true', 'false', all]
        - name: page
          in: query
          required: false
          description: Página, a partir de 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Itens por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de empresas.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaEmpresas'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      operationId: criarEmpresa
      tags: [Administração]
      summary: Cadastrar uma empresa prestadora
      description: O CNPJ é validado pelos dígitos e não pode repetir entre empresas ativas. O plano de estudo aceita 5 empresas ativas.
      security:
        - tokenOrganizacao: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaRequest'
            example:
              name: Filial Centro
              cnpj: '11222333000181'
              razaoSocial: Filial de Estudo LTDA
              codigoMunicipio: '3550308'
              serieNfse: '1'
      responses:
        '201':
          description: Empresa criada.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            X-Ambiente:
              $ref: '#/components/headers/X-Ambiente'
            X-Aviso:
              $ref: '#/components/headers/X-Aviso'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Token sem permissão ou limite de empresas do plano atingido (`limite_de_empresas`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '409':
          description: CNPJ já ativo na organização (`cnpj_duplicado`).
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          $ref: '#/components/responses/LimiteDeRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /org/projects/{id}:
    parameters:
