components:
  securitySchemes:
    chaveProjeto:
      type: apiKey
      in: header
      name: x-api-key
      description: Chave de projeto, prefixo `ntaas_`. Escopos `emit`, `cancel`, `query` e `webhooks`.
    tokenOrganizacao:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Token de organização, prefixo `ntaas_org_`. Escopos `projects:read`, `projects:write`, `api_keys:manage`,
        `settings:read`, `settings:write` e `certificates:write`. Criado só pelo painel.

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador para rastrear a chamada. Fora do padrão, a bancada gera um UUID.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
        examples: [aula-123]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Mesma chave e mesmo corpo devolvem a primeira resposta. Mesma chave com outro corpo devolve `409 idempotency_conflito`.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,80}$
        examples: [emissao-os-1]
    Simulacao:
      name: X-Simulacao
      in: header
      required: false
      description: |
        Força o cenário da fila, como `resultado:atrasoMs` (ex. `timeout:1500`) ou JSON. O campo `simulacao` do corpo vence este header.
      schema:
        type: string
        examples: ['sucesso:0']
    InvoiceId:
      name: id
      in: path
      required: true
      description: Identificador da nota (`inv_…`), devolvido pela emissão.
      schema:
        type: string
        pattern: ^inv_
        examples: [inv_2f6c1b0e9a4d4c7f8e3a1b2c3d4e5f60]
    ProjectId:
      name: id
      in: path
      required: true
      description: Identificador da empresa (`prj_…`).
      schema:
        type: string
        pattern: ^prj_
        examples: [prj_9a8b7c6d5e4f40312a1b2c3d4e5f6071]
    WebhookEvento:
      name: X-Notaas-Event
      in: header
      required: true
      description: Nome do evento.
      schema:
        $ref: '#/components/schemas/NomeEvento'
    WebhookEntrega:
      name: X-Notaas-Delivery
      in: header
      required: true
      description: Identificador da entrega (`del_…`). Igual em todas as retentativas.
      schema:
        type: string
        pattern: ^del_
    WebhookAssinatura:
      name: X-Notaas-Signature
      in: header
      required: false
      description: |
        `sha256=` seguido do HMAC-SHA256 em hexadecimal do corpo cru, com o segredo do endpoint. Ausente quando o endpoint não tem segredo.
      schema:
        type: string
        pattern: ^sha256=[0-9a-f]{64}$

  headers:
    X-Correlation-Id:
      description: Correlation ID recebido ou gerado pela bancada.
      schema:
        type: string
    X-Ambiente:
      description: Sempre `estudo`.
      schema:
        type: string
        const: estudo
    X-Aviso:
      description: Sempre `sem-valor-fiscal`.
      schema:
        type: string
        const: sem-valor-fiscal
    Idempotent-Replayed:
      description: '`true` quando a resposta é o replay de uma requisição idempotente.'
      schema:
        type: string
        const: 'true'
    Content-Disposition:
      description: Nome do arquivo de estudo.
      schema:
        type: string
        examples: ['attachment; filename="nfse-estudo-000001.xml"']
    Retry-After:
      description: Segundos até a janela do rate limit abrir de novo.
      schema:
        type: integer
        examples: [60]

  responses:
    RequisicaoInvalida:
      description: Corpo, JSON, header ou parâmetro inválido (`payload_invalido`, `json_invalido`, `simulacao_invalida`, `idempotency_invalida`…).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:bancada-nfse:problema:payload_invalido
            title: Requisição inválida
            status: 400
            detail: Informe CNPJ, CPF ou NIF do tomador
            instance: /api/v1/emitir
            code: payload_invalido
            campo: tomador.cnpj
            correlationId: aula-123
            aviso: Ambiente de estudo. Nenhum documento foi transmitido à SEFAZ ou a uma prefeitura. Sem valor fiscal.
    NaoAutenticado:
      description: Header `x-api-key` ausente ou chave desconhecida (`nao_autorizado`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:bancada-nfse:problema:nao_autorizado
            title: Não autenticado
            status: 401
            detail: Informe o header x-api-key.
            instance: /api/v1/emitir
            code: nao_autorizado
            campo: null
            correlationId: aula-123
            aviso: Ambiente de estudo. Nenhum documento foi transmitido à SEFAZ ou a uma prefeitura. Sem valor fiscal.
    AcessoNegado:
      description: Tipo de chave errado, chave revogada ou sem escopo (`tipo_de_chave`, `chave_revogada`, `escopo`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: urn:bancada-nfse:problema:tipo_de_chave
            title: Acesso negado
            status: 403
            detail: Esta rota aceita token de organização (prefixo ntaas_org_).
            instance: /api/v1/org/projects
            code: tipo_de_chave
            campo: null
            correlationId: aula-123
            aviso: Ambiente de estudo. Nenhum documento foi transmitido à SEFAZ ou a uma prefeitura. Sem valor fiscal.
    NaoEncontrado:
      description: Recurso inexistente ou de outro projeto/organização (`nao_encontrado`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ConflitoIdempotencia:
      description: '`Idempotency-Key` já usada com outro pedido (`idempotency_conflito`).'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    DocumentoIndisponivel:
      description: O documento ainda não existe para o estado atual da nota (`documento_indisponivel`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    RegraDeNegocio:
      description: A operação não vale para o estado atual (`empresa_inativa`, `status_invalido`, `motivo_invalido`, `evento_ausente`, `sem_dominio`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ConteudoGrande:
      description: Arquivo acima do limite (`arquivo_grande`, `logo_grande`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    LimiteDeRequisicoes:
      description: Teto de requisições por minuto da chave atingido (`rate_limit`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ErroInterno:
      description: Falha inesperada da bancada (`erro_interno`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ServicoIndisponivel:
      description: Banco de estudo indisponível (`banco_indisponivel`).
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    WebhookRecebido:
      description: Qualquer `2xx` confirma a entrega. Fora de `2xx`, a bancada tenta de novo (padrão 10 s, 30 s e 60 s).

  schemas:
    Problema:
      type: object
      description: Problem Details (RFC 9457) com membros de extensão da bancada.
      required: [type, title, status, detail, instance, code, campo, correlationId, aviso]
      properties:
        type:
          type: string
          format: uri
          description: '`urn:bancada-nfse:problema:<code>`.'
          examples: [urn:bancada-nfse:problema:nao_encontrado]
        title:
          type: string
          description: Resumo do status HTTP.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explicação para quem lê.
        instance:
          type: string
          description: Caminho da requisição.
        code:
          type: string
          description: Código estável do erro.
          examples: [nao_encontrado]
        campo:
          type: [string, 'null']
          description: Campo do corpo que causou o erro, quando aplicável.
        correlationId:
          type: string
        aviso:
          type: string

    Saude:
      type: object
      required: [status, ambiente, banco, aviso]
      properties:
        status:
          type: string
          const: ok
        ambiente:
          type: string
          const: estudo
        banco:
          type: string
          const: ok
        aviso:
          type: string

    ResultadoSimulado:
      type: string
      enum: [sucesso, rejeicao, timeout, indisponivel]
      description: Cenário da prefeitura simulada.

    Simulacao:
      type: object
      description: Força o cenário em vez de sortear pela taxa de falha da organização.
      properties:
        resultado:
          $ref: '#/components/schemas/ResultadoSimulado'
        atrasoMs:
          type: integer
          minimum: 0
          maximum: 120000
          description: Espera até a conclusão. Zero conclui no próximo ciclo do varredor.

    Endereco:
      type: object
      properties:
        logradouro:
          type: string
          maxLength: 120
        numero:
          type: string
          maxLength: 20
        complemento:
          type: string
          maxLength: 80
        bairro:
          type: string
          maxLength: 80
        cidade:
          type: string
          maxLength: 80
        uf:
          type: string
          maxLength: 2
        cep:
          type: string
          maxLength: 12
        pais:
          type: string
          maxLength: 2

    EmissaoRequest:
      type: object
      required: [tomador, servico, valores]
      properties:
        tomador:
          type: object
          description: Precisa de `cnpj`, `cpf` ou `nif`. Campos extras são guardados.
          required: [nome]
          additionalProperties: true
          properties:
            nome:
              type: string
              minLength: 2
              maxLength: 300
            cnpj:
              type: string
              description: 14 dígitos com dígito verificador válido.
              examples: ['19131243000197']
            cpf:
              type: string
              description: 11 dígitos com dígito verificador válido.
            nif:
              type: string
              maxLength: 40
              description: Identificação fiscal de tomador estrangeiro.
            email:
              type: string
              format: email
              maxLength: 160
              description: Gera um item na caixa de saída do painel. Nenhum e-mail é enviado.
            telefone:
              type: string
              maxLength: 20
            endereco:
              $ref: '#/components/schemas/Endereco'
        servico:
          type: object
          required: [descricao]
          additionalProperties: true
          properties:
            descricao:
              type: string
              minLength: 1
              maxLength: 2000
            codigo:
              type: string
              maxLength: 20
        valores:
          type: object
          required: [total, aliquotaIss]
          additionalProperties: true
          properties:
            total:
              type: number
              exclusiveMinimum: 0
              maximum: 999999999
            aliquotaIss:
              type: number
              minimum: 0
              maximum: 100
            issRetido:
              type: boolean
        competencia:
          type: string
          pattern: ^\d{4}-\d{2}$
          description: Mês de competência. Sem o campo, vale o mês atual.
          examples: [2026-03]
        referencia:
          type: string
          maxLength: 80
          description: Referência livre do integrador.
        simulacao:
          $ref: '#/components/schemas/Simulacao'

    EmissaoAceita:
      type: object
      required: [queued, invoiceId, status, pollUrl, aviso, cenario, origemCenario, atrasoMs]
      properties:
        queued:
          type: boolean
          const: true
        invoiceId:
          type: string
          pattern: ^inv_
        status:
          type: string
          const: queued
        pollUrl:
          type: string
          description: Caminho para consultar o estado.
          examples: [/api/v1/invoices/inv_2f6c1b0e9a4d4c7f8e3a1b2c3d4e5f60/status]
        aviso:
          type: string
        cenario:
          $ref: '#/components/schemas/ResultadoSimulado'
        origemCenario:
          $ref: '#/components/schemas/OrigemCenario'
        atrasoMs:
          type: integer
          minimum: 0

    OrigemCenario:
      type: string
      enum: [forcado, sorteado]

    StatusNota:
      type: string
      enum: [queued, processing, issued, error, cancel_queued, cancelled]

    CodigoFalha:
      type: string
      enum: [E001, E002, E003, E004]
      description: E001 rejeição, E002 timeout, E003 indisponibilidade, E004 cota esgotada.

    Nota:
      type: object
      required:
        - invoiceId
        - status
        - numeroNfse
        - numero
        - serie
        - chNFSe
        - emittedAt
        - ambiente
        - aviso
        - pdfUrl
        - xmlUrl
        - documentsCached
        - errorCode
        - errorMessage
        - cancelledAt
        - cancelXmlUrl
        - cancelamentoRecusado
        - cenario
        - origemCenario
        - conclusaoPrevista
      properties:
        invoiceId:
          type: string
          pattern: ^inv_
        status:
          $ref: '#/components/schemas/StatusNota'
        numeroNfse:
          type: [string, 'null']
          pattern: ^\d{6,}$
          description: Número com seis dígitos ou mais, depois da emissão.
          examples: ['000001']
        numero:
          type: [string, 'null']
          description: Mesmo valor de `numeroNfse`.
        serie:
          type: [string, 'null']
        chNFSe:
          type: [string, 'null']
          description: Código interno de estudo, começa com `ESTUDO-`. Não é chave oficial.
          examples: [ESTUDO-1-000001]
        emittedAt:
          type: [string, 'null']
          format: date-time
        ambiente:
          type: string
          const: estudo
        aviso:
          type: string
        pdfUrl:
          type: [string, 'null']
          format: uri
        xmlUrl:
          type: [string, 'null']
          format: uri
        documentsCached:
          type: boolean
          description: '`true` quando PDF e XML estão disponíveis.'
        errorCode:
          oneOf:
            - $ref: '#/components/schemas/CodigoFalha'
            - type: 'null'
        errorMessage:
          type: [string, 'null']
        cancelledAt:
          type: [string, 'null']
          format: date-time
        cancelXmlUrl:
          type: [string, 'null']
          format: uri
        cancelamentoRecusado:
          type: [string, 'null']
          description: Motivo da última recusa de cancelamento, se houve.
        cenario:
          $ref: '#/components/schemas/ResultadoSimulado'
        origemCenario:
          $ref: '#/components/schemas/OrigemCenario'
        conclusaoPrevista:
          type: string
          format: date-time

    CancelamentoRequest:
      type: object
      required: [invoiceId]
      properties:
        invoiceId:
          type: string
          minLength: 4
        motivo:
          type: string
          minLength: 15
          maxLength: 255
          description: Opcional. Se vier, precisa ter de 15 a 255 caracteres.
        codigoMotivo:
          type: integer
        simulacao:
          $ref: '#/components/schemas/Simulacao'

    CancelamentoAceito:
      type: object
      required: [queued, invoiceId, status, aviso, cenario, atrasoMs]
      properties:
        queued:
          type: boolean
          const: true
        invoiceId:
          type: string
          pattern: ^inv_
        status:
          type: string
          const: cancel_queued
        aviso:
          type: string
        cenario:
          $ref: '#/components/schemas/ResultadoSimulado'
        atrasoMs:
          type: integer
          minimum: 0

    NomeEvento:
      type: string
      enum: [nfse.issued, nfse.error, nfse.cancelled, nfse.documents_ready]

    WebhookEndpointRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 300
          description: URL `http` ou `https`.
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NomeEvento'
        secret:
          type: [string, 'null']
          maxLength: 120
          description: Segredo do HMAC. Sem segredo, a entrega vai sem `X-Notaas-Signature`.
        active:
          type: boolean
          default: true

    WebhookEndpointPatch:
      type: object
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          maxLength: 300
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NomeEvento'
        secret:
          type: [string, 'null']
          maxLength: 120
        active:
          type: boolean

    WebhookEndpoint:
      type: object
      required: [id, projectId, url, events, hasSecret, active, createdAt]
      properties:
        id:
          type: string
          pattern: ^wh_
        projectId:
          type: string
          pattern: ^prj_
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/NomeEvento'
        hasSecret:
          type: boolean
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    WebhookEndpointCriado:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required: [secret]
          properties:
            secret:
              type: [string, 'null']
              description: Segredo cadastrado. Aparece só na criação.

    EntregaWebhook:
      type: object
      required: [id, endpointId, invoiceId, event, url, status, attempts, nextAttemptAt, lastStatusCode, lastError, createdAt]
      properties:
        id:
          type: string
          pattern: ^del_
        endpointId:
          type: string
          pattern: ^wh_
        invoiceId:
          type: [string, 'null']
        event:
          $ref: '#/components/schemas/NomeEvento'
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [pending, success, failed]
        attempts:
          type: integer
          minimum: 0
        nextAttemptAt:
          type: string
          format: date-time
        lastStatusCode:
          type: [integer, 'null']
        lastError:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    EventoWebhook:
      type: object
      required: [evento, timestamp, aviso, dados]
      properties:
        evento:
          $ref: '#/components/schemas/NomeEvento'
        timestamp:
          type: string
          format: date-time
        aviso:
          type: string
        teste:
          type: boolean
          description: Presente e `true` só no evento de teste.
        dados:
          type: object

    DadosNotaEmitida:
      type: object
      required: [id, numero, status, chNFSe, valorTotal]
      properties:
        id:
          type: string
        numero:
          type: string
        status:
          const: issued
        chNFSe:
          type: string
        valorTotal:
          type: number

    RegimeTributario:
      type: string
      enum: ['1', '2', '3', 3e]
      description: 1 não optante, 2 MEI, 3 Simples Nacional ME/EPP, 3e Simples com excesso de sublimite.

    EmpresaCampos:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        razaoSocial:
          type: string
          minLength: 2
          maxLength: 200
        inscricaoMunicipal:
          type: [string, 'null']
          maxLength: 20
        inscricaoEstadual:
          type: [string, 'null']
          maxLength: 20
        regimeTributario:
          $ref: '#/components/schemas/RegimeTributario'
        codigoMunicipio:
          type: [string, 'null']
          pattern: ^(\d{7})?$
          description: Código IBGE do município, com 7 dígitos.
        email:
          type: [string, 'null']
          description: E-mail de contato, ou vazio.
        telefone:
          type: [string, 'null']
          maxLength: 20
        description:
          type: [string, 'null']
          maxLength: 300
        endereco:
          $ref: '#/components/schemas/Endereco'
        codigoTributacao:
          type: [string, 'null']
          maxLength: 20
        tributacaoIss:
          type: [integer, 'null']
          minimum: 1
          maximum: 4
        serieNfse:
          type: string
          pattern: ^\d{1,5}$
        aliquotaSimples:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        regimeIss:
          type: [integer, 'null']
          minimum: 1
          maximum: 3
        codigoServicoSp:
          type: [string, 'null']
          maxLength: 10
        cnae:
          type: [string, 'null']
          maxLength: 10
        basicAuthUsuario:
          type: [string, 'null']
          maxLength: 80
        basicAuthSenha:
          type: [string, 'null']
          maxLength: 80
          writeOnly: true
          description: Guardada só para o estudo. Nunca volta nas respostas.
        defaultNbs:
          type: [string, 'null']
          maxLength: 12
        defaultCstIbscbs:
          type: [string, 'null']
          maxLength: 3
        defaultClassificacao:
          type: [string, 'null']
          maxLength: 6
        defaultIndicador:
          type: [string, 'null']
          maxLength: 6
        cstPisCofins:
          type: [string, 'null']
          maxLength: 2
        aliquotaPis:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        aliquotaCofins:
          type: [number, 'null']
          minimum: 0
          maximum: 100

    EmpresaRequest:
      allOf:
        - $ref: '#/components/schemas/EmpresaCampos'
        - type: object
          required: [name, cnpj, razaoSocial]
          properties:
            cnpj:
              type: string
              description: 14 dígitos, com ou sem máscara, e dígito verificador válido.
              examples: ['11222333000181']

    EmpresaPatch:
      allOf:
        - $ref: '#/components/schemas/EmpresaCampos'
        - type: object
          minProperties: 1
          description: O CNPJ não pode ser alterado.

    Empresa:
      type: object
      required: [id, name, cnpj, razaoSocial, serieNfse, ultimoNumeroNfse, proximoNumeroNfse, active, hasCertificate, hasLogo, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: ^prj_
        name:
          type: string
        cnpj:
          type: string
          pattern: ^\d{14}$
        razaoSocial:
          type: string
        inscricaoMunicipal:
          type: [string, 'null']
        inscricaoEstadual:
          type: [string, 'null']
        regimeTributario:
          type: [string, 'null']
        codigoMunicipio:
          type: [string, 'null']
        email:
          type: [string, 'null']
        telefone:
          type: [string, 'null']
        description:
          type: [string, 'null']
        endereco:
          $ref: '#/components/schemas/Endereco'
        codigoTributacao:
          type: [string, 'null']
        tributacaoIss:
          type: [integer, 'null']
        serieNfse:
          type: string
        aliquotaSimples:
          type: [number, 'null']
        regimeIss:
          type: [integer, 'null']
        codigoServicoSp:
          type: [string, 'null']
        cnae:
          type: [string, 'null']
        basicAuthUsuario:
          type: [string, 'null']
        hasBasicAuthSenha:
          type: boolean
        ultimoNumeroNfse:
          type: integer
          minimum: 0
        proximoNumeroNfse:
          type: integer
          minimum: 1
        defaultNbs:
          type: [string, 'null']
        defaultCstIbscbs:
          type: [string, 'null']
        defaultClassificacao:
          type: [string, 'null']
        defaultIndicador:
          type: [string, 'null']
        cstPisCofins:
          type: [string, 'null']
        aliquotaPis:
          type: [number, 'null']
        aliquotaCofins:
          type: [number, 'null']
        active:
          type: boolean
        hasCertificate:
          type: boolean
        certFileName:
          type: [string, 'null']
        certUploadedAt:
          type: [string, 'null']
          format: date-time
        hasLogo:
          type: boolean
        hasApiKey:
          type: boolean
          description: Presente em `GET` e `PATCH`. Ausente na criação.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResumoEmpresa:
      type: object
      required: [id, name, cnpj, codigoMunicipio, active, hasCertificate, hasApiKey, proximoNumeroNfse, createdAt]
      properties:
        id:
          type: string
          pattern: ^prj_
        name:
          type: string
        cnpj:
          type: string
          pattern: ^\d{14}$
        codigoMunicipio:
          type: [string, 'null']
        active:
          type: boolean
        hasCertificate:
          type: boolean
        hasApiKey:
          type: boolean
        proximoNumeroNfse:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time

    ListaEmpresas:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResumoEmpresa'
        pagination:
          type: object
          required: [page, limit, total]
          properties:
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 100
            total:
              type: integer
              minimum: 0

    Numeracao:
      type: object
      required: [nfse]
      properties:
        nfse:
          type: object
          required: [ultimoNumero, proximoNumero, serie]
          properties:
            ultimoNumero:
              type: integer
              minimum: 0
            proximoNumero:
              type: integer
              minimum: 1
            serie:
              type: string

    Chave:
      type: object
      required: [id, name, kind, projectId, keyPrefix, scopes, rateLimitPerMinute, active, lastUsedAt, createdAt]
      properties:
        id:
          type: string
          pattern: ^key_
        name:
          type: string
        kind:
          type: string
          enum: [project, org]
        projectId:
          type: [string, 'null']
        keyPrefix:
          type: string
          description: Início da chave, para reconhecer sem expor.
          examples: [ntaas_c2e7]
        scopes:
          type: array
          items:
            type: string
        rateLimitPerMinute:
          type: integer
          minimum: 1
          maximum: 600
        active:
          type: boolean
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    ChaveCriada:
      allOf:
        - $ref: '#/components/schemas/Chave'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Chave completa. Aparece só nesta resposta.

    StatusDominio:
      type: string
      enum: [none, pending_verification, verified]

    Configuracoes:
      type: object
      required: [name, slug, planName, creditsUsed, creditsLimit, projectLimit, latencyMinMs, latencyMaxMs, failureRate, retries, storageBaseUrl, storageStatus]
      properties:
        name:
          type: string
        slug:
          type: string
        planName:
          type: string
          const: Estudo
        creditsUsed:
          type: integer
          minimum: 0
        creditsLimit:
          type: integer
          minimum: 0
        projectLimit:
          type: integer
          minimum: 0
        latencyMinMs:
          type: integer
          minimum: 0
        latencyMaxMs:
          type: integer
          minimum: 0
        failureRate:
          type: integer
          minimum: 0
          maximum: 100
          description: Chance de falha, em porcentagem.
        retries:
          type: array
          description: Esperas das retentativas de webhook, em ms.
          items:
            type: integer
            minimum: 0
        storageBaseUrl:
          type: [string, 'null']
        storageStatus:
          $ref: '#/components/schemas/StatusDominio'

    ListaWebhooks:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'

    WebhookRemovido:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          const: true

    EntregaTesteEnfileirada:
      type: object
      required: [queued, deliveryId]
      properties:
        queued:
          type: boolean
          const: true
        deliveryId:
          type: string
          pattern: ^del_

    ListaEntregasWebhook:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EntregaWebhook'

    EmpresaAtualizada:
      type: object
      required: [updated, id, project]
      properties:
        updated:
          type: boolean
          const: true
        id:
          type: string
          pattern: ^prj_
        project:
          $ref: '#/components/schemas/Empresa'

    NumeracaoPatch:
      type: object
      required: [ultimoNumeroNfse]
      properties:
        ultimoNumeroNfse:
          type: integer
          minimum: 0
          description: Último número já usado fora da bancada.
          examples: [120]

    ListaChaves:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Chave'

    ChaveRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          description: Nome para reconhecer a chave no painel.
          examples: [integracao-erp]
        rateLimitPerMinute:
          type: integer
          minimum: 1
          maximum: 600
          default: 60
          description: Teto de requisições por minuto.

    ChaveRevogada:
      type: object
      required: [revoked, id]
      properties:
        revoked:
          type: boolean
          const: true
        id:
          type: string
          pattern: ^key_

    CertificadoUpload:
      type: object
      required: [file, password]
      properties:
        file:
          type: string
          contentMediaType: application/x-pkcs12
          description: Arquivo `.pfx` de até 50 KB.
        password:
          type: string
          format: password
          description: Senha do certificado. É descartada.

    CertificadoRegistrado:
      type: object
      required: [fileName, validado, aviso, uploadedAt]
      properties:
        fileName:
          type: string
        validado:
          type: boolean
          const: false
        aviso:
          type: string
        uploadedAt:
          type: string
          format: date-time

    LogoUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: image/png
          description: Imagem PNG, JPEG ou WebP.

    LogoSalva:
      type: object
      required: [ok, aviso]
      properties:
        ok:
          type: boolean
          const: true
        aviso:
          type: string

    LogoRemovida:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    DominioArquivosRequest:
      type: object
      required: [storageBaseUrl]
      properties:
        storageBaseUrl:
          type: [string, 'null']
          format: uri
          description: Domínio `https`, ou `null` para remover.
          examples: [https://arquivos.estudo.test]
        simularVerificacao:
          type: boolean
          description: Marca o domínio como verificado sem checar CNAME.

    DominioArquivos:
      type: object
      required: [storageBaseUrl, status, message]
      properties:
        storageBaseUrl:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/StatusDominio'
        message:
          type: string

    EventoNfseEmitida:
      allOf:
        - $ref: '#/components/schemas/EventoWebhook'
        - type: object
          properties:
            evento:
              const: nfse.issued
            dados:
              $ref: '#/components/schemas/DadosNotaEmitida'

    EventoDocumentosProntos:
      allOf:
        - $ref: '#/components/schemas/EventoWebhook'
        - type: object
          properties:
            evento:
              const: nfse.documents_ready
            dados:
              allOf:
                - $ref: '#/components/schemas/DadosNotaEmitida'
                - type: object
                  required: [documentStatus]
                  properties:
                    documentStatus:
                      type: string
                      const: complete

    EventoNfseErro:
      allOf:
        - $ref: '#/components/schemas/EventoWebhook'
        - type: object
          properties:
            evento:
              const: nfse.error
            dados:
              type: object
              required: [id, status, errorCode, errorMessage]
              properties:
                id:
                  type: string
                status:
                  const: error
                errorCode:
                  $ref: '#/components/schemas/CodigoFalha'
                errorMessage:
                  type: string

    EventoNfseCancelada:
      allOf:
        - $ref: '#/components/schemas/EventoWebhook'
        - type: object
          properties:
            evento:
              const: nfse.cancelled
            dados:
              type: object
              required: [id, numeroNfse, status, cancelledAt]
              properties:
                id:
                  type: string
                numeroNfse:
                  type: [string, 'null']
                status:
                  const: cancelled
                cancelledAt:
                  type: string
                  format: date-time
